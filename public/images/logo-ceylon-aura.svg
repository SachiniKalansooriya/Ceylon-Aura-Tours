<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a04a"/>
      <stop offset="50%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#b8933f"/>
    </linearGradient>
  </defs>

  <!-- Compass Circle - deeper navy -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Inner decorative circle -->
  <circle cx="150" cy="150" r="85" fill="none" stroke="#c0c0c0" stroke-width="0.6" stroke-dasharray="2 8" opacity="0.5"/>

  <!-- Cardinal tick marks - richer gold -->
  <line x1="150" y1="45" x2="150" y2="58" stroke="#c9a04a" stroke-width="2"/>
  <line x1="150" y1="242" x2="150" y2="255" stroke="#c9a04a" stroke-width="2"/>
  <line x1="255" y1="150" x2="242" y2="150" stroke="#c9a04a" stroke-width="2"/>
  <line x1="45" y1="150" x2="58" y2="150" stroke="#c9a04a" stroke-width="2"/>

  <!-- Intercardinal tick marks -->
  <line x1="225" y1="73" x2="218" y2="80" stroke="#c9a04a" stroke-width="1.2" opacity="0.8"/>
  <line x1="225" y1="227" x2="218" y2="220" stroke="#c9a04a" stroke-width="1.2" opacity="0.8"/>
  <line x1="75" y1="73" x2="82" y2="80" stroke="#c9a04a" stroke-width="1.2" opacity="0.8"/>
  <line x1="75" y1="227" x2="82" y2="220" stroke="#c9a04a" stroke-width="1.2" opacity="0.8"/>

  <!-- Compass needle - North (deep navy) -->
  <polygon points="150,55 143,148 150,135 157,148" fill="#1e3a5f"/>

  <!-- Compass needle - South (gold) -->
  <polygon points="150,245 143,152 150,165 157,152" fill="url(#goldGrad)"/>

  <!-- East/West needles -->
  <polygon points="245,150 152,143 165,150 152,157" fill="#8a9ab0" opacity="0.7"/>
  <polygon points="55,150 148,143 135,150 148,157" fill="#8a9ab0" opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="150" cy="150" r="4" fill="#c9a04a"/>
  <circle cx="150" cy="150" r="2" fill="#ffffff"/>

  <!-- DISCOVER THE PEARL -->
  <text x="320" y="82" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5a6a7a" letter-spacing="5">DISCOVER THE PEARL</text>

  <!-- CEYLON - darker navy -->
  <text x="320" y="145" font-family="'Sora', 'DM Sans', Helvetica, Arial, sans-serif" font-size="52" font-weight="300" fill="#1e3a5f" letter-spacing="3">CEYLON</text>

  <!-- AURA - bold gold -->
  <text x="320" y="210" font-family="'Sora', 'DM Sans', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#goldGrad)" letter-spacing="5">AURA</text>

  <!-- Gold line -->
  <line x1="320" y1="228" x2="720" y2="228" stroke="#c9a04a" stroke-width="1" opacity="0.6"/>

  <!-- TOURS -->
  <text x="320" y="260" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3a4a5a" letter-spacing="12">T O U R S</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
